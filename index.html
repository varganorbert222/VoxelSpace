<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Voxel Space"
    />
    <meta name="author" content="Norbert Varga" />
    <meta
      name="keywords"
      content="Voxel, VoxelSpace, Voxel Space, Comanche, landscape, rendering"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <script type="module" src="scripts/main.js" defer></script>
    <title>Voxel Space</title>
    <link rel="icon" type="image/x-icon" href="favicon.png" />
  </head>

  <body>
    <div id="id_fps"></div>

    <div id="id_info">
      Fly controls
      <b>WASD</b> move / strafe, <b>Shift</b> faster, <b>click</b> mouse look, <b>arrows</b> look,
      <b>R|F</b> or <b>Space|Ctrl</b> up | down, <b>Q|E</b> roll (panorama),
      <b>P</b> classic 2.5D | spherical panorama
      <br />

      <label for="id_mapselector">Map</label>
      <select id="id_mapselector" title="MapSelector" name="MapSelector">
        <option value="">Please select map</option>
      </select>

      <label for="id_render_distance">Distance</label>
      <input id="id_render_distance" type="range" />

      <label for="id_delta_z">Delta Z</label>
      <input id="id_delta_z" type="range" />

      <label for="id_render_scale">Render Scale</label>
      <input id="id_render_scale" type="range" disabled />

      <label for="id_fov">FOV</label>
      <input id="id_fov" type="range" />

      <label for="id_quality">Quality</label>
      <select
        id="id_quality"
        title="quality"
        name="quality"
      ></select>

      <label for="id_apply_fog">Apply fog</label>
      <input
        id="id_apply_fog"
        title="applyFog"
        name="applyfog"
        type="checkbox"
      />

      <label for="id_repeat">Repeat</label>
      <input
        id="id_repeat"
        title="repeat"
        name="repeat"
        type="checkbox"
      />

      <label for="id_multithread">Multithread</label>
      <input
        id="id_multithread"
        title="multithread"
        name="multithread"
        type="checkbox"
      />

      <label for="id_cameraselector">Camera</label>
      <select id="id_cameraselector" title="CameraSelector" name="CameraSelector">
        <option value="">Please select mode</option>
      </select>

      <label for="id_algorithmselector">Renderer</label>
      <select id="id_algorithmselector" title="AlgorithmSelector" name="AlgorithmSelector">
        <option value="">Please select algorithm</option>
      </select>

      <a href="https://github.com/varganorbert222/VoxelSpace"
        >Github project</a
      >
    </div>

    <canvas id="id_fullscreen_canvas" width="800" height="400">
      Your browser does not support the canvas element.
    </canvas>

    <div id="id_touch_controls">
      <div id="id_stick_move" class="stick" aria-label="Move">
        <div class="stick-knob"></div>
      </div>
      <div id="id_stick_look" class="stick" aria-label="Look">
        <div class="stick-knob"></div>
      </div>
      <div id="id_touch_buttons">
        <button type="button" id="id_btn_up">Up</button>
        <button type="button" id="id_btn_down">Down</button>
        <button type="button" id="id_btn_roll_left" class="pano-only">Roll L</button>
        <button type="button" id="id_btn_roll_right" class="pano-only">Roll R</button>
      </div>
    </div>
  </body>
</html>
